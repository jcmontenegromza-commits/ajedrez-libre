<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuándo Llega Mendoza</title>
<meta name="description" content="Mirá cuándo llega tu colectivo en Mendoza, con avisos y favoritos ilimitados.">
<meta name="theme-color" content="#C8102E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#fff;--tx:#111;--mu:#444;--ac:#C8102E;--ac2:#fff;--bd:#222;--card:#f4f4f4;--ok:#0a5c2b}
@media (prefers-color-scheme:dark){:root{--bg:#000;--tx:#fff;--mu:#ccc;--ac:#ff5c75;--ac2:#000;--bd:#ddd;--card:#161616;--ok:#6fe39a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:18px/1.45 system-ui,Arial,sans-serif}
.skip{position:absolute;left:-999px;top:0;background:var(--ac);color:var(--ac2);padding:12px;z-index:9}
.skip:focus{left:0}
header{background:var(--ac);color:var(--ac2);padding:14px 16px}
header h1{margin:0;font-size:1.4rem}
header p{margin:2px 0 0;font-size:.95rem}
nav{display:flex;flex-wrap:wrap;gap:6px;padding:8px;position:sticky;top:0;background:var(--bg);border-bottom:2px solid var(--bd);z-index:5}
nav button{flex:1 1 30%;min-height:52px;font:inherit;font-weight:700;border:2px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:10px;padding:4px}
nav button[aria-current="page"]{background:var(--ac);color:var(--ac2);border-color:var(--ac)}
main{padding:12px 14px 90px;max-width:760px;margin:0 auto}
h2{font-size:1.3rem;margin:.6em 0 .4em}
h2:focus{outline:3px solid var(--ac)}
button,select,input,textarea{font:inherit;color:var(--tx)}
textarea,input[type=text]{width:100%;box-sizing:border-box;padding:10px;border:2px solid var(--bd);border-radius:8px;background:var(--card)}
.btn{min-height:52px;padding:10px 16px;border-radius:10px;border:2px solid var(--bd);background:var(--card);font-weight:700;cursor:pointer}
.btn.p{background:var(--ac);color:var(--ac2);border-color:var(--ac)}
.btn.w{width:100%;margin:6px 0}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:12px 0;list-style:none;padding:0}.menu li{margin:0}.btn.tile{width:100%;min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;padding:12px}.tile .ic{font-size:2rem;line-height:1}.tile .t{font-size:1.1rem}.tile .m{font-weight:400}
.fila{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}
input[type=search],input[type=text],select{min-height:52px;padding:8px 12px;border:2px solid var(--bd);border-radius:10px;background:var(--bg);width:100%}
label{display:block;font-weight:700;margin-top:10px}
.lista{list-style:none;margin:0;padding:0}
.lista>li{background:var(--card);border:2px solid var(--bd);border-radius:12px;padding:10px 12px;margin:8px 0}
.t{font-weight:700}.m{color:var(--mu);font-size:.95rem}
.vivo{color:var(--ok);font-weight:700}
#aviso{position:fixed;left:0;right:0;bottom:0;background:var(--tx);color:var(--bg);padding:12px 16px;font-weight:700;display:none;z-index:9}
#aviso.on{display:block}
.vacio{padding:14px;border:2px dashed var(--bd);border-radius:12px}
.sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.busq{display:flex;gap:6px;padding:8px;background:var(--bg);border-bottom:2px solid var(--bd)}
.busq input{flex:1;min-width:0}
.busq .btn{min-width:90px}
.alerta{background:#fff3cd;color:#000;border:3px solid #b8860b;border-radius:12px;padding:10px 12px;margin:8px 0}
.alerta h3{margin:0 0 4px;font-size:1.05rem}
#mapa{height:360px;border:2px solid var(--bd);border-radius:12px;margin:8px 0}

.l1{background:#C8102E;color:#fff}.l2{background:#E4E4E4;color:#111;border:2px solid #666}.l3{background:#1B7F3B;color:#fff}.l4{background:#FFD400;color:#111}.l5{background:#FF8A00;color:#111}.l6{background:#59C6F2;color:#111}.l7{background:#0D2A6B;color:#fff}.l8{background:#7B1FA2;color:#fff}.l9{background:#6D4C41;color:#fff}.l0{background:#444;color:#fff}
.lin{display:inline-block;font-weight:800;font-size:1.25rem;padding:4px 12px;border-radius:10px;margin-right:8px}
.llg{margin:4px 0;line-height:1.35}.dest{font-size:1.05rem}
.min{display:block;font-weight:800;font-size:2.6rem;line-height:1.1;margin-top:4px}
.est{display:block;font-weight:800;font-size:1.2rem}
.e-atr{color:#0B57B8}.e-adel{color:#C41E1E}.e-tiempo{color:#13792F}.e-plan{color:#555}
@media (prefers-color-scheme:dark){.e-atr{color:#6FB1FF}.e-adel{color:#FF7A7A}.e-tiempo{color:#6FE39A}.e-plan{color:#bbb}}
.bm{display:inline-block;font-weight:800;font-size:14px;padding:3px 7px;border-radius:12px;border:2px solid #fff;box-shadow:0 0 3px #000;white-space:nowrap}
.leyenda span{display:inline-block;margin:3px 6px 3px 0}
.bus{font-size:26px;line-height:26px;text-align:center}
.itm{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.itm .info{flex:1 1 230px;min-width:0}.itm .btn{flex:0 0 auto;min-width:130px}
.chk{display:flex;gap:10px;align-items:center;min-height:52px;margin-top:8px}
.chk input{width:28px;height:28px}
</style>
</head>
