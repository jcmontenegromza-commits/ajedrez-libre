<label for="t">Texto de la guía</label><textarea id="t" readonly>ANÁLISIS LIBRE
Estudio y análisis de ajedrez, explicado con palabras, hecho para personas ciegas o con baja visión.

QUÉ ES
Es una aplicación para teléfono Android que funciona con lectores de pantalla como TalkBack o Jieshuo. Sirve para jugar, estudiar aperturas, practicarlas y analizar posiciones y partidas completas. Todo se explica con frases claras, sin necesidad de ver el tablero ni de tocar casillas.

CÓMO SE MUEVE
Hay un cuadro de edición donde escribís o dictás. Las jugadas se pueden decir en español, en inglés o en portugués. Ejemplos: e4, Cf3, caballo efe tres, e2e4, enroque corto. Si dos piezas pueden ir al mismo lugar, la aplicación te avisa y te pide que aclares desde dónde, por ejemplo Cbd2. Para coronar, agregás la pieza, por ejemplo e8=D.
A los costados del cuadro de edición están los botones Anterior y Siguiente. Se usan para recorrer aperturas, líneas y partidas.

PARTE 1. APERTURAS Y ESTUDIO

Buscar una apertura
Escribí el nombre, por ejemplo francesa, siciliana o apertura inglesa. También sirve un código ECO, como B90, o las jugadas, por ejemplo e4 c5 Cf3. La aplicación te da una lista numerada. Escribís el número y elegís.
Después podés decir: ver, estudiar o practicar.

Estudiar
Con siguiente y anterior vas recorriendo la apertura jugada por jugada. Cada jugada te la lee con una explicación.
Idea: te cuenta la idea de la jugada o el plan de la apertura.
Plan: el plan general de la apertura.
Ramas: te muestra las variantes posibles en el punto donde estás.
Dónde estoy: te dice en qué variante estás.
Volver a la bifurcación: vuelve al último punto donde se podía elegir otro camino.
Diferencias: te explica en qué se diferencian dos caminos.
Salir del estudio: terminás.

Practicar
Vos jugás las jugadas de la apertura y la aplicación juega las del rival. Hay tres modos:
Libre: podés jugar lo que quieras y te avisa si te saliste de la teoría.
Guiado: te va ayudando.
Estricto: tenés que acertar la jugada de la teoría.
Pista: te da una ayuda, primero la idea, después la pieza y después la jugada con el motivo.
Mostrar: te muestra la jugada correcta.
Salir: terminás la práctica.

Repertorio y repaso
Guardar: guarda la apertura en tu repertorio.
Repertorio: te lee las aperturas que guardaste.
Repasar: te hace repasar con repetición espaciada, es decir que las que te cuestan vuelven antes.

Mientras jugás una partida normal
La aplicación va diciendo sola el nombre de la apertura que se está jugando y te avisa cuando te salís de la teoría.
Continuaciones: te dice qué jugadas siguen según la teoría.
Qué apertura es: te repite el nombre de la apertura actual.
Si apretás Siguiente, se juega la primera continuación de la teoría. Si apretás Anterior, volvés una jugada atrás y podés cambiar de línea cuando quieras.

PARTE 2. ANÁLISIS CON PALABRAS

Vistazo
Escribí vistazo. Te da tres frases de resumen de la posición: quién está mejor, qué está pasando y cuál es el plan.

Análisis
Análisis: te da las mejores líneas del motor, siempre marcando la mejor, y te dice cuándo está mejor el otro bando.
Detalle corto, detalle normal o detalle completo: elegís cuánto te cuenta.

Estructura
Escribí estructura. Te habla de los peones: aislados, doblados, pasados, colgantes y casillas débiles.

Tácticas
Escribí tácticas. Te avisa si hay mate en una jugada, piezas colgadas, tenedores o clavadas.

Amenazas del rival
Escribí amenazas del rival. Te dice qué haría el otro bando si le tocara jugar ahora: mates, capturas que ganan material, tenedores o coronaciones.

Control de casillas
Escribí control. Te dice quién domina el centro, cada flanco y las casillas del campo contrario que dominás sin oposición.

Qué cambió
Escribí qué cambió. Después de una jugada te explica qué cambió en la posición.

Zonas
Escribí zonas. Te lee el tablero por sectores: flanco de dama, centro y flanco de rey.

Alfil o caballo
Escribí alfil o caballo. Cuando hay un alfil contra un caballo, te explica cuál conviene.

Proyección
Escribí proyecta 20. Te muestra cómo seguiría la posición en unas 20 jugadas, y qué cambiaría en el material y en los peones. Con ver proyección la recorrés jugada por jugada.

Pista
Escribí pista. Primero te da una idea, después la pieza y por último la jugada con el motivo.

Sonido
Escribí sonido. Te hace escuchar la evaluación de la posición como un tono: más agudo si estás mejor, más grave si estás peor.

PARTE 3. ANALIZAR UNA PARTIDA COMPLETA

Analizar partida
Escribí analizar partida. La aplicación revisa todas las jugadas y las califica: excelente, buena, imprecisión, error o error grave, para cada bando. Tarda unos segundos.

La curva de la partida, en palabras
Al terminar el análisis, además del resumen te cuenta cómo fue la partida por tramos, como si fuera el gráfico que ven los demás. Por ejemplo: de la jugada 1 a la 3, equilibrio; en la jugada 4, ventaja de las blancas; de la jugada 6 a la 7, ventaja decisiva de las negras. También dice cuántos cambios de situación hubo y en qué jugada salieron de la teoría.

Ir a un momento
Cerrá el panel del análisis y escribí ir a 14, o ir a 14 negras. Te lleva a ese momento y te lee la jugada con su calidad. Con Siguiente y Anterior seguís desde ahí. Así podés saltar a los errores sin recorrer toda la partida. Para salir, escribí cerrar revisión.

Revisar
Escribí revisar. Te deja recorrer la partida jugada por jugada.

Árbol
Escribí árbol. Abre el árbol de líneas para ver las variantes.

PARTE 3B. Y AHORA QUÉ: EL PLAN
Cuando termina la teoría, o en cualquier momento, escribí y ahora qué (también sirven plan, qué hago, hacia dónde o por qué). La aplicación te dice: en qué etapa estamos, qué jugada conviene y por qué, hacia dónde lleva esa línea (si ganás material, si hay cambios, cuánta ventaja queda) y el plan a mediano plazo: qué piezas desarrollar, qué columna ocupar, qué debilidad del rival atacar, si conviene simplificar o complicar, y qué hacer con el rey.
Con detalle corto da dos objetivos, normal tres y completo cinco.

PARTE 4. PARTIDAS FAMOSAS
Escribí partidas. La aplicación te lee una lista numerada de catorce partidas históricas, como la Ópera de Morphy, la Inmortal, la Siempreviva, la partida del siglo de Fischer, Kasparov contra Topalov, Fischer contra Spassky y Deep Blue contra Kasparov. Elegís por número. Te cuenta quiénes jugaron, dónde, cuándo y cómo terminó, con un comentario corto.
Con Siguiente y Anterior la recorrés jugada por jugada. Escribí ir a 12 para saltar a la jugada 12. Escribí cargar para pasarla al tablero y analizarla con el motor, con analizar partida.

PARTE 4B. ESTUDIOS DE LICHESS
Para estudiar con los estudios que ya tenés o que armó otra gente en Lichess, sin pelear con la página. Pegá en el cuadro de edición el link del estudio, o escribí lichess y el código de ocho letras. Si el estudio es privado, conectá antes tu cuenta con el token en Ajustes. Con tu cuenta conectada, escribí mis estudios para escuchar la lista de los tuyos y elegir por número.
Primero escuchás la lista de capítulos. Elegís uno por su número y lo recorrés con Siguiente y Anterior. En cada jugada escuchás el comentario del autor, las flechas y casillas marcadas dichas con palabras, y si hay variantes: variante 1 entra, volver regresa a la línea anterior.
Otros comandos: capitulos, capitulo siguiente, comentario (repite lo que dice el autor) y cargar (lleva la línea al tablero para analizarla con el motor).

PARTE 5. EDITOR DE POSICIONES
Sirve para armar una posición pieza por pieza, con pocas piezas, como un final, o con muchas. Escribí editor para empezar con el tablero vacío, o editar posición para partir de la que tenés.
Poné piezas diciendo, por ejemplo: rey blanco e1, torre blanca a3, dama negra b5, rey negro e8. También podés agrupar por color: blancas rey e1 torre a3, negras rey e8.
Para sacar una pieza: quitar a3. Para vaciar todo: vaciar. Para la posición inicial: posición inicial.
Para decir a quién le toca: mueven blancas o mueven negras. Para escuchar lo que hay: qué hay.
Cuando termines escribí listo. La aplicación revisa que haya un rey de cada color y que la posición sea posible, y empieza el juego desde ahí. Con cancelar salís sin cambios.

PARTE 6. EXPORTAR LA PARTIDA
En el panel PGN podés copiar, seleccionar o descargar la partida en formato PGN, que es el estándar que entienden todos los programas de ajedrez.

PARTE 7. COMANDOS POR VOZ
Abajo a la derecha hay un botón con un micrófono. Mantenelo apretado, decí el comando y soltá: se envía solo y se ejecuta, igual que un audio de WhatsApp. Por ejemplo: e4, peón e4, caballo f3, ayuda, partidas, revisar.
También podés tocarlo una vez para empezar a hablar y otra vez para enviar. Con TalkBack o Jieshuo, el toque doble funciona así.
La primera vez Android pide permiso de micrófono: aceptalo y volvé a apretar el botón. Hace falta el servicio de voz de Google en el teléfono. En la computadora y en el iPhone usa el reconocimiento del navegador y necesita internet.

ASPECTO PARA QUIEN VE
En Ajustes, sección Aspecto, podés cambiar: los colores de la pantalla (automático, claro, oscuro o alto contraste negro y amarillo), los colores del tablero (madera, verde, azul gris, azul y naranja para daltonismo, o alto contraste), las piezas (dibujadas o con letras grandes), el tamaño del tablero (normal o grande) y el tamaño del texto y de los botones (normal, grande, muy grande o enorme). Nada de esto cambia lo que lee el lector de pantalla.

AJUSTES
Podés elegir el lector de pantalla. Con Jieshuo, la aplicación mueve sola el foco a cada jugada y lee con su propia voz. También se puede activar la vibración y el aviso de apertura automático.

LICENCIA
Podés probarla 5 veces gratis. Después se activa con un código de licencia.

AYUDA
En cualquier momento escribí ayuda, o ayuda aperturas, y la aplicación te recuerda los comandos.
